{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}HR Система{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

   <link rel="stylesheet" href="{% static 'css/theme-pink.css' %}">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .content {
            flex: 1;
            padding: 32px;
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
        }
        .footer {
            text-align: center;
            padding: 20px 32px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-soft);
            background: var(--bg-body);
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 998;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active {
            display: block;
        }
        @media (max-width: 768px) {
            .content {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- БОКОВОЕ МЕНЮ -->


    <!-- ОСНОВНАЯ ОБЁРТКА -->
    <div class="main-wrapper">

        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->


        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main class="content">

            <!-- СООБЩЕНИЯ -->

            <!-- КОНТЕНТ СТРАНИЦЫ -->
            {% block content %}{% endblock %}

        </main>

        <!-- ПОДВАЛ -->
        <footer class="footer">
            © 2026 <strong>HR Система</strong> — Управление персоналом с любовью 💕
        </footer>

    </div>

    {% if user.is_authenticated %}
    <!-- Ссылки для авторизованного пользователя -->
    <a href="{% url 'account:info' %}" class="btn btn-outline-primary me-2">
        <i class="bi bi-person"></i> Профиль
    </a>
    <a href="{% url 'account:logout' %}" class="btn btn-danger">
        <i class="bi bi-box-arrow-right"></i> Выйти
    </a>
{% else %}
    <!-- Ссылка для гостя -->
    <a href="{% url 'account:login' %}" class="btn btn-primary">
        <i class="bi bi-box-arrow-in-right"></i> Войти
    </a>
{% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const hamburger = document.getElementById('hamburgerBtn');

            if (hamburger) {
                hamburger.addEventListener('click', function() {
                    sidebar.classList.toggle('open');
                    overlay.classList.toggle('active');
                });
                overlay.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}

</body>
</html>
